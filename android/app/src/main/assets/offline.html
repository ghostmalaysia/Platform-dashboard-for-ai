<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111410">
  <title>Ghost Platform · Sambungan Termux</title>
  <style>
    :root{color-scheme:dark;font:16px system-ui,sans-serif;background:#111410;color:#edf0eb}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}.card{max-width:440px;border:1px solid #343c31;border-radius:16px;background:#191e18;padding:24px;box-shadow:0 18px 70px #0008}h1{font-size:22px;margin:0 0 10px}p,li{color:#aab4a5;font-size:14px;line-height:1.6}.mark{color:#c7ed89;font-size:13px;letter-spacing:.12em}code{color:#d5edb3}button{margin-top:12px;border:0;border-radius:8px;background:#c7ed89;color:#172012;padding:11px 15px;font-weight:700;font-size:14px}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">✳ GHOST PLATFORM</div>
    <h1 id="offline-title">Server Termux tidak berjalan</h1>
    <p id="offline-steps">Buka Termux dan mulakan dashboard lokal:</p>
    <ol><li><code>cd ~/Platform-dashboard-for-ai</code></li><li><code>node server.js</code></li></ol>
    <p id="offline-hint">Biarkan Termux terbuka, kembali ke sini dan cuba lagi.</p>
    <button type="button" id="offline-retry" onclick="location.replace('http://127.0.0.1:3000/')">Sambung semula</button>
  </main>
  <script>
    (function () {
      if ((navigator.language || '').toLowerCase().indexOf('ms') === 0) return;
      document.documentElement.lang = 'en';
      document.title = 'Ghost Platform · Termux connection';
      document.getElementById('offline-title').textContent = 'Termux server is not running';
      document.getElementById('offline-steps').textContent = 'Open Termux and start the local dashboard server:';
      document.getElementById('offline-hint').textContent = 'Keep Termux open, return here and try again.';
      document.getElementById('offline-retry').textContent = 'Reconnect';
    })();
  </script>
</body>
</html>
